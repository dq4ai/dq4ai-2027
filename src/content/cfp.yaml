scope:
  - >-
    The rapid emergence of artificial intelligence (AI), including knowledge graphs (KGs) and
    generative AI, is transforming data science and data management.
    These technologies increasingly rely on large-scale, heterogeneous, dynamic, and continuously
    evolving data, making the quality of the underlying data, models, and processes fundamental to
    the reliability of modern AI systems.
  - >-
    Ensuring data quality across the AI lifecycle raises multifaceted challenges. KGs face issues
    such as incompleteness, inconsistency, incorrect links, outdated facts, and lack of provenance,
    while generative AI models raise concerns about hallucinations, bias, factual grounding, and reproducibility.
    Similar challenges arise in generative and multimodal AI, retrieval-augmented generation, AI
    agents, and hybrid systems. When these technologies interact, quality issues become intertwined
    and require new approaches to data preparation, validation, provenance, evaluation, and
    monitoring.
  - >-
    At the same time, AI techniques are increasingly becoming part of data management and data
    quality workflows, creating a two-way relationship between AI and data quality: ensuring
    high-quality data for AI while leveraging AI to improve data quality management.
goal: >-
  The goal of the workshop is to bring together researchers and practitioners from the data
  management and AI communities to discuss methods, systems, benchmarks, evaluation frameworks, and
  applications addressing these challenges. It aims to foster cross-disciplinary exchange at the
  intersection of data quality, AI and trustworthy data management.
topicsIntro: >-
  The workshop welcomes contributions addressing all aspects of data quality for AI, including but
  not limited to:
topics:
  - title: Data and knowledge quality management
    items:
      - Data profiling and quality assessment
      - Error detection, data validation, cleaning, and repair
      - Entity resolution, link prediction, and ontology alignment
      - Provenance, explainability, and trustworthiness
      - Quality management in dynamic and large-scale settings
      - Data and knowledge governance, privacy, and responsible management
  - title: Data quality across the AI lifecycle
    items:
      - Quality of training, validation, and fine-tuning data for foundation models, generative AI, RAG, and AI agents
      - Factual errors, hallucinations, and grounding of AI-generated outputs
      - Multimodal data quality, including cross-modal alignment, consistency, and integration
  - title: AI-driven quality management
    items:
      - Generative AI for data cleaning, integration, transformation, and enrichment
      - AI-driven knowledge graph construction, enrichment, validation, and maintenance
      - AI agents for data quality management
      - LLM-KG synergies for improving data quality
  - title: Evaluation, benchmarks, and applications
    items:
      - Data quality metrics, benchmarks, and evaluation frameworks
      - Human-in-the-loop approaches for data quality assessment
      - Assessment of the impact of data quality on AI performance and reliability
      - Real-world applications and industrial deployments
paperTypesIntro: "The workshop solicits papers in the following categories:"
paperTypes:
  - id: research
    title: Research papers
    description: >-
      Original research contributions addressing challenges in data quality for AI, including new
      methods, algorithms, frameworks, models, or theoretical approaches.
  - id: system-application
    title: System and application papers
    description: >-
      The implementation or application of data quality research in real-world settings, including
      industrial deployments, domain-specific applications, and practical experiences.
  - id: vision
    title: Vision papers
    description: >-
      Perspectives on emerging challenges, open problems, or research opportunities in data quality
      for AI. They may highlight gaps in existing approaches, present challenging use cases, and
      propose directions for future research.
paperLengths: >-
  The workshop will accept full papers (up to 8 pages, including references) and short papers
  describing work in progress, systems, demos/systems/applications, or vision/innovative ideas (up
  to 4 pages, including references).
proceedingsNote: >-
  Accepted papers will be published in the CEUR Workshop Proceedings, subject to the applicable
  publication policies.
presentation: Accepted papers will be presented during the workshop.
