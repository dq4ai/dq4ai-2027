# Deadline statuses are computed at build time, so a daily rebuild moves "upcoming" to "passed".
# A day ends in Anywhere on Earth at 12:00 UTC, so the rebuild runs just after that.
name: Scheduled rebuild

on:
  schedule:
    - cron: "5 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
