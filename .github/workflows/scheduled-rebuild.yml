# Deadline statuses are computed at build time, so a daily rebuild moves "upcoming" to "passed".
name: Scheduled rebuild

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
