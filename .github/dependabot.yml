version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # typescript-eslint and astro check do not support TypeScript 7 yet. See docs/ARCHITECTURE.md.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
