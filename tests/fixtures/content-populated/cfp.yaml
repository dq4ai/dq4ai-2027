scope:
  - >-
    The rapid emergence of artificial intelligence (AI), including knowledge graphs (KGs), large
    language models (LLMs), and generative AI, is transforming data science and data management.
    These technologies increasingly rely on large-scale, heterogeneous, dynamic, and continuously
    evolving data, making the quality of the underlying data, models, and processes fundamental to
    the reliability of modern AI systems.
  - >-
    Ensuring data quality across the AI lifecycle raises multifaceted challenges. KGs face issues
    such as incompleteness, inconsistency, incorrect links, outdated facts, and lack of provenance,
    while LLMs raise concerns about hallucinations, bias, factual grounding, and reproducibility.
    Similar challenges arise in generative and multimodal AI, retrieval-augmented generation, AI
    agents, and hybrid systems. When these technologies interact, quality issues become intertwined
    and require new approaches to data preparation, validation, provenance, evaluation, and
    monitoring.
  - >-
    At the same time, AI techniques are increasingly becoming part of data management and
    data-quality workflows, creating a two-way relationship between AI and data quality: ensuring
    high-quality data for AI while leveraging AI to improve data quality management.
goal: >-
  The goal of the workshop is to bring together researchers and practitioners from the data
  management, data quality, and AI communities to discuss methods, systems, benchmarks, evaluation
  frameworks, and applications addressing these challenges. It aims to foster cross-disciplinary
  exchange at the intersection of data quality, AI, and trustworthy data management.
exchange:
  - Data quality for AI
  - AI for data quality
topicsIntro: >-
  The workshop welcomes contributions addressing all aspects of data quality for AI, including but
  not limited to:
topics:
  - title: AI for data quality
    description: >-
      LLMs and other AI techniques for data profiling, cleaning, error detection, data repair,
      quality assessment, and monitoring.
  - title: Data quality for AI
    description: >-
      Quality of training and fine-tuning data for foundation models, LLMs, generative AI, RAG, and
      AI agents, including bias, reliability and robustness.
  - title: Knowledge graphs
    description: >-
      Quality in KG construction, enrichment, and maintenance, including schema validation,
      constraint checking, entity resolution, ontology alignment, consistency, completeness,
      provenance, and evolution.
  - title: Quality in LLMs, NLP, and generative AI
    description: >-
      Hallucinations, factual errors, bias, uncertainty, and evaluation of language models and NLP
      systems.
  - title: Data management and governance for AI
    description: >-
      Quality-aware data management, data preparation and integration, lineage, traceability,
      versioning, reproducibility, privacy, fairness, transparency, and trustworthy AI across the AI
      lifecycle.
  - title: Multimodal data quality
    description: >-
      Quality across text, images, audio, video, structured, and sensor data, including cross-modal
      alignment, consistency, and integration.
  - title: Evaluation and benchmarks
    description: >-
      Metrics, benchmarks, evaluation frameworks, human-in-the-loop approaches, and methods for
      assessing data quality and its impact on AI systems.
  - title: Applications and case studies
    description: >-
      Real-world and industrial deployments, technology transfer, and lessons learned from
      maintaining data quality at scale.
